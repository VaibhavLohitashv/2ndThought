<!-- FILE: src/app/components/post-tree/post-tree.html -->
<ng-template #renderPost let-p>
    <div class="post" [ngClass]="{ highlight: p._highlight }">
        <div class="post-header">
            <div class="post-avatar">
                {{ (p.user?.full_name || p.user?.email || 'U').charAt(0).toUpperCase() }}
            </div>
            <div class="post-meta">
                <div class="post-user">{{ p.user?.full_name || p.user?.email || 'Unknown' }}</div>
                <div class="post-time">{{ p.created_at | date:'short' }}</div>
            </div>
        </div>

        <div class="post-content">{{ p.content }}</div>
        <div *ngIf="p.image_url" class="post-image">
            <img [src]="p.image_url" alt="Post image" class="post-img">
        </div>

        <div class="post-actions">
            <button *ngIf="canReply()" class="action-btn reply" (click)="toggleReply(p.id)">
                <span class="action-icon">↩️</span>
                <span>Reply</span>
            </button>
            <button *ngIf="canDelete(p)" class="action-btn delete" (click)="deletePost(p.id)">
                <span class="action-icon">🗑️</span>
                <span>Delete</span>
            </button>
        </div>

        <!-- Reply box -->
        <div class="reply-box" *ngIf="replyOpen[p.id]">
            <textarea class="reply-textarea" [(ngModel)]="replyContent[p.id]" (input)="typing.emit()"
                placeholder="Write your reply..."></textarea>
            <div class="image-upload">
                <input type="file" accept="image/*" (change)="onReplyFileSelected(p.id, $event)" style="display: none"
                    #fileInput>
                <button type="button" class="image-btn" (click)="fileInput.click()">📎 Attach Image</button>
                <span *ngIf="replyImage[p.id]" class="image-name">{{ replyImage[p.id]!.name }}</span>
                <button *ngIf="replyImage[p.id]" type="button" class="remove-btn"
                    (click)="removeReplyImage(p.id)">❌</button>
            </div>
            <div class="reply-actions">
                <button class="reply-btn" (click)="toggleReply(p.id)">Cancel</button>
                <button class="reply-btn primary" (click)="replyTo(p.id)"
                    [disabled]="replying[p.id] || !(replyContent[p.id] && replyContent[p.id].trim())">
                    {{ replying[p.id] ? 'Sending...' : 'Reply' }}
                </button>
            </div>
        </div>

        <!-- Child posts -->
        <div class="post-children" *ngIf="p.children && p.children.length > 0">
            <ng-container *ngFor="let c of p.children">
                <ng-container *ngTemplateOutlet="renderPost; context: { $implicit: c }"></ng-container>
            </ng-container>
        </div>
    </div>
</ng-template>

<ng-container *ngFor="let p of posts">
    <ng-container *ngTemplateOutlet="renderPost; context: { $implicit: p }"></ng-container>
</ng-container>
