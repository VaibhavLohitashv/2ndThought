<!-- FILE: src/app/pages/threads/create-thread-modal.html -->
<div class="modal-backdrop" (click)="close()">
    <div class="modal-card" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h3 class="modal-title">Create New Thread</h3>
            <button class="modal-close" (click)="close()">×</button>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" class="form-input" [(ngModel)]="title" [disabled]="loading"
                    placeholder="Give your thread a title..." autofocus />
            </div>

            <div class="form-group">
                <label class="form-label">Description (optional)</label>
                <textarea class="form-input form-textarea" [(ngModel)]="description" [disabled]="loading"
                    placeholder="What's this thread about?"></textarea>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancel" (click)="close()" [disabled]="loading">
                Cancel
            </button>
            <button class="btn-create" (click)="submit()" [disabled]="loading || !title.trim()">
                {{ loading ? 'Creating...' : 'Create Thread' }}
            </button>
        </div>
    </div>
</div>
