version: "3.9"

services:
  db:
    image: postgres:15
    container_name: forum_db
    environment:
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_DB: forum_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: forum_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
